name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: lint — ruff on Python sources
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Lint Python sources
        run: ruff check erp/ scripts/ tests/ --select E,W,F --ignore E501

  # ─────────────────────────────────────────────────────────────
  # Job 2: test — pytest with DuckDB (no Snowflake needed)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install duckdb pytest pytest-cov
          # Deps mínimas para os testes (simulador puro-Python + DuckDB)
          pip install requests beautifulsoup4 || true

      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=erp --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Job 3: dbt-build — dbt run/test with DuckDB (no Snowflake)
  # ─────────────────────────────────────────────────────────────
  dbt-build:
    name: dbt build (DuckDB CI)
    runs-on: ubuntu-latest
    needs: test

    env:
      DBT_PROFILES_DIR: /tmp/dbt_ci_profiles
      # Build against the small versioned sample (real schema, real rows) — not fake stubs.
      DBT_CSV_DIR: ${{ github.workspace }}/seed_sample

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: ${{ runner.os }}-dbt-packages-${{ hashFiles('dbt/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-dbt-packages-

      - name: Install dbt-core and dbt-duckdb
        run: pip install dbt-core==1.11.11 dbt-duckdb==1.10.1

      - name: Create CI profiles.yml (DuckDB only, no Snowflake)
        run: |
          mkdir -p /tmp/dbt_ci_profiles
          cat > /tmp/dbt_ci_profiles/profiles.yml << 'EOF'
          retail_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/ci_retail.duckdb
                schema: main
                threads: 2
              dev_raw:
                type: duckdb
                path: /tmp/ci_retail.duckdb
                schema: main
                threads: 2
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (ci target, DuckDB)
        working-directory: dbt
        run: dbt build --target ci --profiles-dir /tmp/dbt_ci_profiles
