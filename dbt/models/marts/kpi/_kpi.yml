version: 2

models:
  # ── Manager / store-ops cockpit (operational grain) ──────────────────────
  - name: mart_ventas_hora
    description: >
      Afluência de vendas por hora do dia (hora-punta), habilitada pelo carimbo
      intradía order_ts. Dimensionamento de caixas/pessoal. Grão: order_hour.
    columns:
      - name: order_hour
        description: Hora do dia (0-23)
        tests: [not_null, unique]
      - name: num_pedidos
        tests: [not_null]

  - name: mart_store_day
    description: >
      Cockpit do gerente de loja: vendas, ticket, unidades, rupturas e fill rate
      por loja × dia (canal tienda). Grão: store_id × date_id.
    columns:
      - name: store_id
        tests: [not_null]
      - name: date_id
        tests: [not_null]
      - name: fill_rate_pct
        description: Disponibilidade = units_sold / (units_sold + unmet_units) × 100

  - name: mart_mermas
    description: >
      Mermas / caducidad de perecíveis (saída real de estoque). Grão:
      year_month × location_type × category. Unidades e custo perdido.
    columns:
      - name: year_month
        tests: [not_null]
      - name: lost_cost
        tests: [not_null]

  - name: mart_gmv_mensal
    description: >
      GMV (Gross Merchandise Value) mensal agregado a partir de fct_sales.
      Inclui total bruto, total líquido, número de pedidos, linhas e ticket médio por mês.
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
      - name: gmv_gross
        description: Soma do total_gross de todas as linhas de venda no mês
        tests:
          - not_null
      - name: num_pedidos
        description: Número distinto de pedidos no mês
        tests:
          - not_null

  - name: mart_margem_por_categoria
    description: >
      Margem bruta por categoria de produto e mês. Calcula revenue (line_total_net),
      custo estimado (unit_price_net * qty * cost_price/sale_price), gross_profit e margin_pct.
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
      - name: product_category
        description: Categoria do produto (dim_product.category)
        tests:
          - not_null
      - name: revenue
        description: Soma de line_total_net para a categoria e mês
        tests:
          - not_null

  - name: mart_fill_rate_mensal
    description: >
      Fill rate mensal de DISPONIBILIDADE (on-shelf availability), por year_month:
      fill_rate_stockout = unidades entregues / (entregues + não atendidas por ruptura).
      É a definição padrão de varejo e fica ~96-98%. Também expõe perfect_order_pct
      (pedidos sem nenhuma ruptura / total), naturalmente mais baixo.
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
          - unique
      - name: total_pedidos
        description: Número distinto de pedidos no mês
        tests:
          - not_null
      - name: fill_rate_stockout
        description: Razão pedidos sem ruptura / total de pedidos (decimal 0 a 1)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: fill_rate_stockout_pct
        description: Fill rate baseado em ruptura em percentual (0 a 100)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: mart_top_produtos
    description: >
      Produtos para Top SKUs e drill-down por categoria. Grão (year_month, product_id).
      revenue (sum line_total_net), units (sum quantity_ordered), cost estimado e margin_pct.
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
      - name: product_id
        description: Identificador do produto
        tests:
          - not_null
      - name: product_name
        description: Nome do produto (dim_product.product_name)
        tests:
          - not_null
      - name: category
        description: Categoria do produto (dim_product.category)
        tests:
          - not_null
      - name: revenue
        description: Soma de line_total_net do produto no mês
        tests:
          - not_null
      - name: units
        description: Soma de quantity_ordered do produto no mês
        tests:
          - not_null

  - name: mart_churn_60d
    description: >
      Identificação de clientes em risco de churn (60 dias sem compra). Enriquecido
      com segment (Bronze → Platinum), atraso médio de entrega e contagem de stockouts
      que impactaram o cliente — permite análise de fatores de risco de churn por segmento.
    columns:
      - name: customer_id
        description: Identificador do cliente
        tests:
          - not_null
          - unique
      - name: last_purchase_date
        description: Data da última compra do cliente
        tests:
          - not_null
      - name: is_churned
        description: Verdadeiro se days_since_purchase > 60
        tests:
          - not_null
      - name: segment
        description: Segmento atual do cliente (Bronze, Silver, Gold, Platinum)
      - name: avg_delay_days
        description: Média de dias de atraso nas entregas ecommerce do cliente (0 para clientes tienda)
      - name: stockout_count
        description: Número de eventos de ruptura que impactaram o cliente diretamente

  - name: mart_rfm
    description: >
      Segmentação RFM por cliente: Recency (dias desde última compra), Frequency
      (pedidos distintos), Monetary (soma total_gross). Scores 1-3 via NTILE(3),
      segmento concatenado (333 = melhor, 111 = pior) e rfm_label semântico
      (Champions → Loyal Customers → Potential Loyalists → At Risk → Hibernating → Lost).
    columns:
      - name: customer_id
        description: Identificador do cliente
        tests:
          - not_null
          - unique
      - name: rfm_segment
        description: "Segmento RFM concatenado (ex: 333, 111 — melhor a pior)"
        tests:
          - not_null
      - name: rfm_label
        description: "Label semântico: Champions, Loyal Customers, Potential Loyalists, At Risk, Hibernating, Lost"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Champions', 'Loyal Customers', 'Potential Loyalists', 'At Risk', 'Hibernating', 'Lost']
      - name: monetary
        description: Soma de total_gross do cliente
        tests:
          - not_null

  - name: mart_ap_aging
    description: >
      Accounts Payable Aging: aging de pagamentos a fornecedores agrupado por
      supplier_id e bucket de dias em atraso (0-current, 01-30d, 31-60d, 61-90d, 91d+).
    columns:
      - name: supplier_id
        description: Identificador do fornecedor
        tests:
          - not_null
      - name: aging_bucket
        description: Faixa de aging do pagamento
        tests:
          - not_null
      - name: total_amount_gross
        description: Soma dos valores brutos pagos no bucket
        tests:
          - not_null

  - name: mart_iva_resumo
    description: >
      Resumo de IVA por alíquota e mês: base imponible (line_total_net),
      cuota_iva (line_total_net * line_tax_rate) e total com IVA.
      Tipos: S1=21% (general), S2=10% (reducido), S4=4% (superreducido).
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
      - name: iva_type
        description: Tipo de IVA (S1, S2, S4)
        tests:
          - not_null
      - name: base_imponible
        description: Soma de line_total_net (base de cálculo do IVA)
        tests:
          - not_null

  - name: mart_carrier_performance
    description: >
      Performance por transportadora: total de entregas, on_time_rate (entregas
      no prazo), avg_delay_days (média de dias de atraso quando atrasado),
      total de pacotes e peso total.
    columns:
      - name: carrier
        description: Nome da transportadora
        tests:
          - not_null
          - unique
      - name: total_entregas
        description: Total de entregas realizadas pela transportadora
        tests:
          - not_null
      - name: on_time_rate
        description: Proporção de entregas realizadas no prazo (0 a 1)

  - name: mart_stockouts_mensal
    description: >
      Rupturas de estoque por mês (de stg_stockouts + dim_date). num_stockouts,
      qty_requested, qty_unmet (= requested − available; available=0 nos dados),
      unmet_pct. Fonte do dashboard (tab Logística).
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
          - unique
      - name: num_stockouts
        description: Número de eventos de ruptura no mês
        tests:
          - not_null
      - name: qty_unmet
        description: Unidades demandadas e não atendidas no mês
        tests:
          - not_null

  - name: mart_stockouts_por_categoria
    description: >
      Top categorias por demanda não atendida (de stg_stockouts + dim_product).
    columns:
      - name: product_category
        description: Categoria do produto
        tests:
          - not_null
          - unique
      - name: qty_unmet
        description: Unidades não atendidas na categoria
        tests:
          - not_null

  - name: mart_stock_movements_mensal
    description: >
      Movimentações de estoque por tipo (IN/OUT/TRANSFER) e mês (de
      stg_stock_movements + dim_date). num_movements, total_delta. TRANSFER soma ~0.
    columns:
      - name: year_month
        description: Mês de referência no formato YYYY-MM
        tests:
          - not_null
      - name: movement_type
        description: Tipo de movimentação (IN, OUT, TRANSFER)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['IN', 'OUT', 'TRANSFER', 'RETURN']
      - name: num_movements
        description: Número de movimentações no mês/tipo
        tests:
          - not_null

  # ── Supplier & DC performance ─────────────────────────────────────────────
  - name: mart_supplier_performance
    description: >
      Supplier Scorecard: OTIF (On-Time In-Full), fill rate, on_time_rate e lead time
      real vs. prometido por fornecedor. OTIF = entregue no prazo E com ≥95% das
      unidades pedidas. Grão: supplier_id.
    columns:
      - name: supplier_id
        description: Identificador do fornecedor
        tests:
          - not_null
          - unique
      - name: otif_rate
        description: Proporção de POs entregues on-time e in-full (0 a 1)
        tests:
          - not_null
      - name: fill_rate
        description: Unidades recebidas / unidades pedidas (0 a 1)
        tests:
          - not_null
      - name: avg_lead_time_actual
        description: Lead time médio real em dias (do pedido à recepção)

  - name: mart_dc_sla
    description: >
      SLA por Distribution Center: on_time_rate (entregas no prazo), atraso médio
      quando atrasado e tempo médio de trânsito (dispatch → entrega). Grão: dc_id.
    columns:
      - name: dc_id
        description: Identificador do DC de origem
        tests:
          - not_null
          - unique
      - name: on_time_rate
        description: Proporção de entregas realizadas no prazo (0 a 1)
      - name: avg_transit_days
        description: Tempo médio de trânsito em dias (dispatch → actual delivery)

  # ── Customer Lifecycle ─────────────────────────────────────────────────────
  - name: mart_customer_cohort
    description: >
      Cohort retention: por cada mês de aquisição (cohort_month = mês de registro),
      quantos clientes dessa coorte ainda compraram em cada mês de atividade.
      Grão: cohort_month × activity_month.
    columns:
      - name: cohort_month
        description: Mês de registro/aquisição do cliente (YYYY-MM)
        tests:
          - not_null
      - name: activity_month
        description: Mês de atividade em análise (YYYY-MM)
        tests:
          - not_null
      - name: retention_rate
        description: active_customers / cohort_size (decimal 0-1)
        tests:
          - not_null

  - name: mart_customer_ltv
    description: >
      Customer Lifetime Value simplificado: receita histórica total (LTV = soma de
      receita bruta ao longo do dataset), frequência, AOV, coorte e dias ativos.
      Grão: customer_id.
    columns:
      - name: customer_id
        description: Identificador do cliente
        tests:
          - not_null
          - unique
      - name: total_revenue_gross
        description: Receita bruta total do cliente ao longo do dataset (LTV histórico)
        tests:
          - not_null
      - name: total_orders
        description: Número distinto de pedidos realizados pelo cliente
        tests:
          - not_null
