[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entrypoint inserts the project root into sys.path before importing local
# packages, so module-level imports legitimately follow that statement.
"erp/run_simulation.py" = ["E402"]
# Mercadona scraper utilities add their own dir to sys.path before importing.
"erp/resources/mercadona/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
